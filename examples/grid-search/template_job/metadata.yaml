# Placeholders in {BRACES} are filled by setup_tasks.py per cell.
path: PROJECT/experiments/DATE_SLUG/tasks/{MODEL}/{DATASET}
tags:
  # Main tag = path + version, UNIQUE per cell (so re-running the generator skips committed
  # cells). Compose the whole sweep later with find_all over a glob, e.g.
  # {$glob: PROJECT/experiments/DATE_SLUG/tasks/*/*/v1.0.0}.
  - PROJECT/experiments/DATE_SLUG/tasks/{MODEL}/{DATASET}/v1.0.0
  - USER
  - CLUSTER
  - compute
task_meta:
  model: "{MODEL}"
  dataset: "{DATASET}"
projects:
  - PROJECT
versions:
  - version: 1.0.0
    comment: Generated by setup_tasks.py.
comment: >-
  One cell of the {MODEL}×{DATASET} grid. tags[0] is unique per cell, so re-running the
  generator skips cells already committed.
